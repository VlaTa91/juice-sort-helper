name: Проверка решателя
on:
  push:
    paths:
      - "planner.js"
      - "scanner.js"
      - "index.html"
      - "sw.js"
      - "journal.js"
      - "memory.js"
      - "tests/planner tests.js"
      - "tests/memory tests.js"
      - "tests/strategy tests.js"
      - ".github/workflows/planner tests.yml"
  workflow_dispatch:
jobs:
  planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node "tests/planner tests.js"
      - run: node "tests/memory tests.js"
      - run: node "tests/strategy tests.js"
